<style>
/* ================================================================
   Plastic-Craft Blog Single Post Template — Elementor Pro Version
   Brand: Navy #1B365D, Accent #4A90D9, Montserrat + Lora

   SETUP: In Elementor Theme Builder > Single Post template:
   1. Add an HTML widget — paste this entire code block
   2. Add a Post Content widget BELOW the HTML widget
   3. The CSS below hides the Post Content widget visually
      but it must exist for Elementor to work
   ================================================================ */

/* Hide the Elementor Post Content widget — we render our own styled version */
.elementor-widget-theme-post-content {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    overflow: hidden !important;
    clip: rect(0,0,0,0) !important;
    white-space: nowrap !important;
    border: 0 !important;
    padding: 0 !important;
    margin: -1px !important;
}

/* ---- TEMPLATE STYLES ---- */
.pc-article, .pc-article * { margin: 0; padding: 0; box-sizing: border-box; }
.pc-article {
    --navy: #1B365D;
    --navy-dark: #122744;
    --accent: #4A90D9;
    --accent-light: #6AABF0;
    --white: #FFFFFF;
    --off-white: #F8FAFC;
    --light-blue: #EDF2F8;
    --light-blue-trans: rgba(237, 242, 248, 0.65);
    --dark-blue: #1E2D3D;
    --steel: #5A7B95;
    --border: #D4DEE8;
    --shadow-sm: 0 2px 8px rgba(27,54,93,0.06);
    --shadow-md: 0 4px 14px rgba(27,54,93,0.08);
    font-family: 'Lora', Georgia, serif;
    line-height: 1.7;
    color: var(--dark-blue);
    background: var(--off-white);
}

/* ---- HERO HEADER ---- */
.pc-article .article-hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: var(--white);
    padding: 48px 30px 40px;
}
.pc-article .hero-inner {
    max-width: 900px;
    margin: 0 auto;
}

/* Breadcrumb */
.pc-article .article-breadcrumb {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 0.72em;
    font-weight: 500;
    margin-bottom: 20px;
    opacity: 0.65;
}
.pc-article .article-breadcrumb a {
    color: var(--accent-light);
    text-decoration: none;
}
.pc-article .article-breadcrumb a:hover { opacity: 1; }
.pc-article .article-breadcrumb .sep { margin: 0 8px; opacity: 0.4; }

/* Header layout: title + image side by side */
.pc-article .hero-header {
    display: flex;
    align-items: center;
    gap: 32px;
}

/* Title column */
.pc-article .hero-text {
    flex: 1;
    min-width: 0;
}
.pc-article .article-category {
    display: inline-block;
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 0.65em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--white);
    background: var(--accent);
    padding: 4px 14px;
    border-radius: 4px;
    margin-bottom: 14px;
}
.pc-article .article-title {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 2.1em;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
}
.pc-article .article-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 0.75em;
    font-weight: 500;
    opacity: 0.8;
}
.pc-article .meta-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.pc-article .meta-icon { font-size: 1em; opacity: 0.7; }
.pc-article .meta-divider {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
}

/* Header image block */
.pc-article .hero-image {
    flex-shrink: 0;
    width: 180px;
    height: 140px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.12);
}
.pc-article .hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.pc-article .hero-image-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 0.7em;
    color: rgba(255,255,255,0.3);
}

/* ---- ARTICLE BODY ---- */
.pc-article .article-body {
    max-width: 740px;
    margin: 0 auto;
    padding: 48px 24px 60px;
}

/* Light blue transparent article card */
.pc-article .article-card {
    background: var(--light-blue-trans);
    border-radius: 16px;
    padding: 48px 44px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(212, 222, 232, 0.5);
    box-shadow: var(--shadow-sm);
}

/* ---- CONTENT TYPOGRAPHY ---- */
.pc-article .article-content {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.02em;
    line-height: 1.85;
    color: var(--dark-blue);
}
.pc-article .article-content h2 {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 1.5em;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.3;
    margin-top: 2em;
    margin-bottom: 0.6em;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(74, 144, 217, 0.15);
}
.pc-article .article-content h3 {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 1.2em;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.3;
    margin-top: 1.6em;
    margin-bottom: 0.5em;
}
.pc-article .article-content h4 {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 1.02em;
    font-weight: 700;
    color: var(--accent);
    margin-top: 1.4em;
    margin-bottom: 0.4em;
}
.pc-article .article-content p {
    margin-bottom: 1.3em;
    line-height: 1.85;
}
.pc-article .article-content a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(74,144,217,0.3);
    text-underline-offset: 3px;
    transition: color 0.2s;
}
.pc-article .article-content a:hover {
    color: var(--navy);
    text-decoration-color: var(--navy);
}
.pc-article .article-content ul,
.pc-article .article-content ol {
    margin: 1em 0 1.3em 1.5em;
}
.pc-article .article-content li {
    margin-bottom: 0.45em;
    line-height: 1.75;
    padding-left: 4px;
}
.pc-article .article-content ul li::marker { color: var(--accent); }
.pc-article .article-content blockquote {
    margin: 1.8em 0;
    padding: 20px 26px;
    border-left: 3px solid var(--accent);
    background: rgba(237,242,248,0.5);
    border-radius: 0 10px 10px 0;
    font-style: italic;
    color: var(--navy);
}
.pc-article .article-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
    font-size: 0.92em;
    border-radius: 10px;
    overflow: hidden;
}
.pc-article .article-content thead th {
    background: var(--navy);
    color: #fff;
    font-family: 'Montserrat', Arial, sans-serif;
    font-weight: 600;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 12px 16px;
    text-align: left;
}
.pc-article .article-content td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
}
.pc-article .article-content tbody tr:nth-child(even) { background: rgba(248,250,252,0.7); }
.pc-article .article-content img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    margin: 1em 0;
}
.pc-article .article-content figcaption {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 0.78em;
    color: var(--steel);
    text-align: center;
    margin-top: 6px;
}
.pc-article .article-content code {
    font-family: 'Courier New', monospace;
    background: rgba(237,242,248,0.8);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--navy);
}
.pc-article .article-content pre {
    background: var(--dark-blue);
    color: #E8ECF0;
    padding: 22px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 1.5em 0;
    font-size: 0.88em;
    line-height: 1.6;
}
.pc-article .article-content pre code {
    background: none;
    padding: 0;
    color: inherit;
}
.pc-article .article-content hr {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 2.2em 0;
}

/* First h2 needs no top margin */
.pc-article .article-content h2:first-child { margin-top: 0; }

/* ---- RESPONSIVE ---- */
@media (max-width: 768px) {
    .pc-article .article-hero { padding: 36px 20px 32px; }
    .pc-article .hero-header {
        flex-direction: column-reverse;
        gap: 20px;
        align-items: flex-start;
    }
    .pc-article .hero-image {
        width: 120px;
        height: 96px;
    }
    .pc-article .article-title { font-size: 1.55em; }
    .pc-article .article-body { padding: 32px 16px 48px; }
    .pc-article .article-card { padding: 32px 24px; }
}
@media (max-width: 480px) {
    .pc-article .article-title { font-size: 1.3em; }
    .pc-article .article-meta {
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
    }
    .pc-article .article-card { padding: 24px 18px; }
}
</style>

<div class="pc-article">
    <!-- HERO -->
    <div class="article-hero">
        <div class="hero-inner">
            <div class="article-breadcrumb">
                <a href="/">Home</a>
                <span class="sep">/</span>
                <a href="/blog/">Blog</a>
                <span class="sep">/</span>
                <span id="pcaBreadcrumbTitle">Article</span>
            </div>

            <div class="hero-header">
                <!-- Title & meta -->
                <div class="hero-text">
                    <div class="article-category" id="pcaCategory">Blog</div>
                    <h1 class="article-title" id="pcaTitle"></h1>
                    <div class="article-meta">
                        <span class="meta-item">
                            <span class="meta-icon">&#128197;</span>
                            <span id="pcaDate"></span>
                        </span>
                        <span class="meta-divider"></span>
                        <span class="meta-item">
                            <span class="meta-icon">&#9201;</span>
                            <span id="pcaReadTime"></span>
                        </span>
                        <span class="meta-divider"></span>
                        <span class="meta-item">
                            <span class="meta-icon">&#128100;</span>
                            Plastic-Craft Team
                        </span>
                    </div>
                </div>

                <!-- Header image block -->
                <div class="hero-image" id="pcaHeroImage">
                    <div class="hero-image-placeholder" id="pcaHeroPlaceholder">No image</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ARTICLE BODY -->
    <div class="article-body">
        <div class="article-card">
            <div class="article-content" id="pcaContent">
                <div id="pcaPostContent"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
"use strict";
var SITE_URL = window.location.origin;
var slug = window.location.pathname.replace(/\/$/, '').split('/').pop();
if (!slug) return;

var pageTitle = document.title.split('|')[0].split('-')[0].split('\u2013')[0].trim();
var titleEl = document.getElementById('pcaTitle');
var breadcrumbEl = document.getElementById('pcaBreadcrumbTitle');
if (titleEl) titleEl.textContent = pageTitle;
if (breadcrumbEl) breadcrumbEl.textContent = pageTitle.length > 50 ? pageTitle.substring(0, 50) + '...' : pageTitle;

fetch(SITE_URL + '/wp-json/wp/v2/posts?_embed&slug=' + encodeURIComponent(slug))
    .then(function(r) { return r.json(); })
    .then(function(posts) {
        if (!Array.isArray(posts) || posts.length === 0) return;
        var post = posts[0];

        // Title
        if (titleEl && post.title && post.title.rendered) {
            var cleanTitle = post.title.rendered.replace(/<[^>]*>/g, '');
            titleEl.textContent = cleanTitle;
            if (breadcrumbEl) breadcrumbEl.textContent = cleanTitle.length > 50 ? cleanTitle.substring(0, 50) + '...' : cleanTitle;
        }

        // Date
        var dateEl = document.getElementById('pcaDate');
        if (dateEl) {
            var d = new Date(post.date);
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            dateEl.textContent = months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        // Read time
        var readTimeEl = document.getElementById('pcaReadTime');
        if (readTimeEl && post.content && post.content.rendered) {
            var tmp = document.createElement('div');
            tmp.innerHTML = post.content.rendered;
            var words = (tmp.textContent || '').trim().split(/\s+/).length;
            readTimeEl.textContent = Math.max(1, Math.ceil(words / 200)) + ' min read';
        }

        // Category
        var catEl = document.getElementById('pcaCategory');
        if (catEl && post._embedded && post._embedded['wp:term'] && post._embedded['wp:term'][0]) {
            var filtered = post._embedded['wp:term'][0].filter(function(c) { return c.name !== 'Uncategorized'; });
            if (filtered.length > 0) catEl.textContent = filtered[0].name;
        }

        // Hero image (next to title)
        var heroImageEl = document.getElementById('pcaHeroImage');
        var placeholderEl = document.getElementById('pcaHeroPlaceholder');
        if (heroImageEl && post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
            var media = post._embedded['wp:featuredmedia'][0];
            var imgUrl = (media.media_details && media.media_details.sizes && media.media_details.sizes.thumbnail)
                ? media.media_details.sizes.thumbnail.source_url
                : (media.media_details && media.media_details.sizes && media.media_details.sizes.medium)
                    ? media.media_details.sizes.medium.source_url
                    : media.source_url;
            var img = document.createElement('img');
            img.src = imgUrl;
            img.alt = media.alt_text || post.title.rendered.replace(/<[^>]*>/g, '');
            img.loading = 'eager';
            if (placeholderEl) placeholderEl.style.display = 'none';
            heroImageEl.appendChild(img);
        }

        // Post Content
        var contentEl = document.getElementById('pcaPostContent');
        if (contentEl && post.content && post.content.rendered) {
            contentEl.innerHTML = post.content.rendered;
        }

        // Schema.org Article
        var schema = {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": post.title.rendered.replace(/<[^>]*>/g, ''),
            "datePublished": post.date,
            "dateModified": post.modified,
            "author": {"@type": "Organization", "name": "Plastic-Craft Products", "url": "https://www.plastic-craft.com"},
            "publisher": {"@type": "Organization", "name": "Plastic-Craft Products", "url": "https://www.plastic-craft.com"},
            "description": post.excerpt ? post.excerpt.rendered.replace(/<[^>]*>/g, '').trim().substring(0, 200) : '',
            "mainEntityOfPage": {"@type": "WebPage", "@id": post.link}
        };
        if (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
            schema.image = post._embedded['wp:featuredmedia'][0].source_url;
        }
        var s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(schema);
        document.head.appendChild(s);
    })
    .catch(function() {
        var dateEl = document.getElementById('pcaDate');
        var readTimeEl = document.getElementById('pcaReadTime');
        if (dateEl) dateEl.textContent = 'Recent';
        if (readTimeEl) readTimeEl.textContent = '5 min read';
    });
})();
</script>
